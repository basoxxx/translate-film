name: Build macOS (Intel + Apple Silicon)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      versione:
        description: "Per pubblicare una release scrivi la versione (es. v1.1.0); vuoto = solo build"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test-linux:
    name: Test Linux (EasyOCR)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dipendenze
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Test end-to-end
        run: python tests/test_completo.py --cartella test-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-linux-output
          path: test-out/*.srt

  build-mac:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: intel
          - runner: macos-15
            arch: apple-silicon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Info
        run: |
          uname -m; sw_vers
          python -c "import platform, tkinter; print(platform.machine(), 'Tk', tkinter.TkVersion)"
      - name: Dipendenze
        run: pip install -r requirements-mac.txt
      - name: Test dello script (OCR Apple Vision)
        run: python tests/test_completo.py --ocr vision --cartella test-script
      - name: Build dell'app
        run: ./build_mac.sh
      - name: Test dell'app compilata (con l'ffmpeg incluso nell'app)
        env:
          TRADUTTORE_FFMPEG: incluso
        run: |
          python tests/test_completo.py --ocr vision --cartella test-app \
            --eseguibile "dist/Traduttore Sottotitoli.app/Contents/MacOS/Traduttore Sottotitoli"
      - name: Pacchetti (zip + dmg)
        run: |
          NOME="TraduttoreSottotitoli-macOS-${{ matrix.arch }}"
          echo "${{ matrix.arch }}: richiede macOS $(cat dist/MINIMO.txt) o successivo" > "minimo-${{ matrix.arch }}.txt"
          ditto -c -k --sequesterRsrc --keepParent "dist/Traduttore Sottotitoli.app" "$NOME.zip"
          mkdir dmg && cp -R "dist/Traduttore Sottotitoli.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Traduttore Sottotitoli" -srcfolder dmg -ov -format UDZO "$NOME.dmg"
          ls -lh "$NOME".*
      - uses: actions/upload-artifact@v4
        with:
          name: TraduttoreSottotitoli-macOS-${{ matrix.arch }}
          path: |
            TraduttoreSottotitoli-macOS-*.dmg
            TraduttoreSottotitoli-macOS-*.zip
            minimo-*.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-mac-${{ matrix.arch }}-output
          path: test-*/*.srt

  release:
    name: Pubblica release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.versione != '')
    needs: [build-mac, test-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: TraduttoreSottotitoli-macOS-*
          merge-multiple: true
      - name: Note della release
        run: |
          {
            echo "## Download per Mac"
            echo
            echo "- **Apple Silicon** (M1, M2, M3, M4…): \`TraduttoreSottotitoli-macOS-apple-silicon.dmg\`"
            echo "- **Intel**: \`TraduttoreSottotitoli-macOS-intel.dmg\`"
            echo
            for f in minimo-*.txt; do echo "- $(cat "$f")"; done
            echo
            echo "Alla prima apertura macOS chiede conferma (app non firmata da Apple): vedi il README."
            echo "Serve anche [Ollama](https://ollama.com/download): il modello AI si scarica da solo al primo uso."
          } > NOTE.md
          cat NOTE.md
      - name: Crea la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONE: ${{ inputs.versione }}
        run: |
          ls -lh
          TAG="${VERSIONE:-$GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber TraduttoreSottotitoli-macOS-*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Traduttore Sottotitoli $TAG" --notes-file NOTE.md TraduttoreSottotitoli-macOS-*
          fi
